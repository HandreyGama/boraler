<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha -BoraLer</title>
    <link rel="stylesheet" href="../../css/senha.css" />
    <script type="module" src="/templates/login/anime.js"></script>
    <script type="module" src="/templates/login/senha.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </head>

  <body>
    <section id="login">
      <div id="login-container">
        <h1 id="login-title">BoraLer</h1>
        <h3 id="login-subtitle">Recuperar Senha</h3>
        <form id="login-form">
          <div></div>

          <label id="text-email" for="email-input">Email:</label>
          <input type="email" id="email-input" class="text-input" placeholder="E-mail" />

          <label id="text-senha" for="password-input">Nova senha:</label>
          <div class="password-wrapper">
            <input type="password" id="password-input" class="text-input" placeholder="Nova senha" />
            <span id="toggle-password" class="material-symbols-outlined">visibility</span>
          </div>

          <label id="text-confirmar-senha" for="password-input">Confirmar nova senha:</label>
          <div class="password-wrapper">
              <input type="password" id="password-input" class="text-input-senha" placeholder="Confirmar nova senha" />
            <span id="toggle-password" class="material-symbols-outlined">visibility</span>
          </div>

          <div id="login-buttons">
            <button class="login-button" type="submit">Alterar senha</button>
            <a href="/" id="forget-password-link" class="login-reset-senha">Voltar para a tela de login</a>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
