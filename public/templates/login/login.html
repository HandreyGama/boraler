<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoraLer</title>
    <link rel="stylesheet" href="../../css/login.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/templates/login/anime.js"></script>
    <script type="module" src="/templates/login/login.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </head>

  <body>
    <section id="login">
      <div id="login-container">
        <h1 id="login-title">BoraLer</h1>
        <h3 id="login-subtitle">Bem-vindo!</h3>
        <p id="login-sub">Faça seu login para continuar</p>
        <form id="login-form">
          <div></div>

          <label id="text-email" for="email-input">Email:</label>
          <input type="email" id="email-input" class="text-input" placeholder="E-mail" />

          <label id="text-senha" for="password-input">Senha:</label>
          <div class="password-wrapper">
            <input type="password" id="password-input" class="text-input" placeholder="Senha" />
            <span id="toggle-password" class="material-symbols-outlined">visibility</span>
          </div>

          <div id="login-buttons">
            <button class="login-button" type="submit">Login</button>
            <a href="/register" id="register-button" class="login-button">Criar nova conta</a>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
